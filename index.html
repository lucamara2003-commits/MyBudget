<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="My Budget"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>My Budget</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app">
<header><div><div class="eyebrow">CONTROLLO SPESE PERSONALI</div><h1>My Budget</h1></div><button id="exportBtn" class="iconbtn" aria-label="Esporta dati">⇩</button></header>
<section class="summary"><div class="monthrow"><label for="month">Periodo</label><input id="month" type="month"></div><div class="muted">Speso questo mese</div><div class="big" id="spent">€0,00</div><div class="summaryline"><span>Budget totale</span><b id="budget">€0,00</b></div><div class="summaryline"><span>Disponibilità</span><b id="remaining">€0,00</b></div><div class="track"><i id="overallBar"></i></div><small id="overallPct">0% del budget utilizzato</small></section>
<section><div class="sectionhead"><h2>I tuoi contenitori</h2><button class="textbtn" id="addCategory">＋ Categoria</button></div><div id="categories" class="cards"></div></section>
<section class="entry"><h2>＋ Registra una spesa</h2><form id="expenseForm"><label>Categoria<select id="expenseCategory" required></select></label><div class="formrow"><label>Importo (€)<input id="amount" type="number" min="0.01" step="0.01" placeholder="Es. 55,00" required></label><label>Data<input id="date" type="date" required></label></div><label>Descrizione (facoltativa)<input id="description" maxlength="70" placeholder="Es. Pieno di benzina"></label><button class="primary" type="submit">Aggiungi spesa</button></form></section>
<section><div class="sectionhead"><h2>Movimenti</h2><button class="textbtn" id="clearMonth">Svuota mese</button></div><div id="movements" class="movements"></div></section>
<footer>I dati restano su questo dispositivo. Esporta periodicamente una copia di sicurezza.</footer>
</main>
<dialog id="categoryDialog"><form method="dialog" id="categoryForm"><h2 id="dialogTitle">Nuova categoria</h2><label>Nome<input id="catName" required maxlength="30" placeholder="Es. Benzina"></label><label>Budget mensile (€)<input id="catLimit" type="number" min="0" step="0.01" required placeholder="300"></label><div class="dialogactions"><button class="secondary" value="cancel">Annulla</button><button class="primary" id="saveCategory" value="default">Salva</button></div></form></dialog>
<input type="file" id="importFile" accept="application/json" hidden>
<script src="app.js"></script><script>if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
